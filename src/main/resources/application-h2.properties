# ==========================================================
#  Optional demo profile: in-memory H2 database (no MySQL needed)
#  Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
#  Data is lost when the app stops.
# ==========================================================
spring.datasource.url=jdbc:h2:mem:typemaster;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
