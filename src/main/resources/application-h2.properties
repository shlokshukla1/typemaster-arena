# ==========================================================
#  Local profile: H2 database saved to a file (no MySQL needed)
#  Run with:  mvn spring-boot:run -Dspring-boot.run.profiles=h2
#  Data is stored in ./data/typemaster.mv.db and kept between restarts
#  (users, scores, progress). Delete that file to start fresh.
# ==========================================================
spring.datasource.url=jdbc:h2:file:./data/typemaster;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
