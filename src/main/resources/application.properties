# ==========================================================
#  TypeMaster Arena - application configuration
# ==========================================================
spring.application.name=typemaster-arena
# Hosting platforms (Railway, Render, Cloud Run) pass the port in the PORT env var
server.port=${PORT:8080}

# ---------- MySQL (default) ----------
# Database is created automatically if it does not exist (createDatabaseIfNotExist=true).
# Override credentials with env vars DB_URL / DB_USERNAME / DB_PASSWORD, or edit below.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/typemaster_arena?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# Driver is detected from the URL: jdbc:mysql://... (MySQL) or jdbc:postgresql://... (PostgreSQL / Neon)

# ---------- JPA / Hibernate ----------
# "update" keeps your data between restarts and creates missing tables.
# database/schema.sql contains the equivalent DDL if you prefer creating tables manually.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- App ----------
# Login token lifetime in days
app.auth.token-days=30

# Admin panel account - created at first startup (open the site, log in with it, then go to #/admin).
# The admin password is set to this value on every start (env ADMIN_PASSWORD overrides it).
# Only the admin account is touched - other users are never changed or deleted.
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Shlok@Type#2026}
app.admin.email=${ADMIN_EMAIL:admin@typemaster.local}

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Never leak stack traces in API error responses
server.error.include-stacktrace=never

# Cache busting: JS/CSS URLs get a content hash (e.g. app-<hash>.js), so browsers always load the latest version
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/js/**,/css/**
